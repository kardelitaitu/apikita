# CI: the checks between a commit and a deploy.
#
# These are exactly the pull-request stages docs/ci-cd.md lists — format check,
# lint, build, unit tests, the database suite and schema check, secret scan, plus
# the website toolchain. There is deliberately no deploy job: the on-merge
# sequence (snapshot -> migrate -> deploy server -> health check -> deploy
# frontend) belongs to docs/deployment.md and needs provider secrets this
# repository does not hold.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # No service container and no DATABASE_URL: SQLite is bundled, so the database
    # is a file. Nothing here needs a second process, and the test suite needs no
    # environment at all — see the integration step below.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format check
        working-directory: server
        run: cargo fmt --check

      - name: Lint
        working-directory: server
        run: cargo clippy -- -D warnings

      # Dependency audit: known CVEs in the LOCKFILE.
      #
      # This is the one gate that looks OUTSIDE the repository — every other check
      # here can pass while a dependency is found to be vulnerable, because
      # nothing in the source changes when an advisory is published. It caught a
      # real one the first time it ran (RUSTSEC-2023-0071, rsa 0.9.10).
      #
      # It reads `server/.cargo/audit.toml`, so the single exception this repo
      # carries is COMMITTED and REVIEWABLE rather than an `--ignore` flag buried
      # in this file. Adding an exception therefore requires a commit with its
      # reasoning, which is the point.
      #
      # `--deny warnings` is deliberately NOT passed: the audit's own default
      # already fails on a vulnerability, and "unmaintained" is surfaced through
      # `informational_warnings` in the config as a warning, not a build break.
      # A gate that fails on a crate merely being unmaintained gets muted, and a
      # muted gate is worse than none.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency audit
        working-directory: server
        run: cargo audit

      - name: Build
        working-directory: server
        run: cargo build

      - name: Unit tests
        working-directory: server
        run: cargo test

      # Schema check: every migration must apply, in order, to an empty database.
      # `bin/migrate` is the mechanism the register names (`sqlx migrate`,
      # forward-only, never on application boot): it creates the file, applies the
      # whole `./migrations` set through `sqlx::migrate!("./migrations")`, and
      # exits non-zero unless `journal_mode` is `wal` and `foreign_keys` is on.
      # The database is deleted first so "empty" is literal, not assumed.
      - name: Apply migrations to an empty database
        working-directory: server
        env:
          DATABASE_URL: sqlite://ci-schema-check.db
        run: |
          rm -f ci-schema-check.db ci-schema-check.db-wal ci-schema-check.db-shm
          cargo run --bin migrate

# Schema DRIFT, not just applicability. The step above proves the migrations APPLY;
      # this proves the shipped schema still matches the plan's Appendix A - "the plan is a
      # lie about the database, which is worse than no plan" - and then runs 32 INVARIANT
      # probes against the shipped migration: every table STRICT, no REAL/FLOAT column, the
      # CHECK constraints actually refusing bad rows, FK and RESTRICT behaviour.
      #
      # It had never run in CI. docs/ci-cd.md:372 asked the question outright - "Whether the
      # schema-drift check runs as a CI step or stays a local probe ... no workflow step
      # invokes it yet". Answering it found the file had been FAILING: the plan was missing
      # the `topups.rail` column, and because the drift check exits before the invariants,
      # those 32 probes had never run anywhere. A red first half was hiding a whole second
      # half.
      - name: Validate the schema against the plan
        run: python3 tools/sqlite-probes/validate-migration-schema.py

      # There is no second, `#[ignore]`d database tier any more. The database is a
      # file, so `server/src/test_support.rs` gives every database test its own
      # migrated temp database and the whole suite runs with no service container
      # and no DATABASE_URL.
      #
      # Nothing is skipped or `#[ignore]`d: the former live-PocketBase exchange
      # test was replaced by a loopback stub, and the identity port has since
      # deleted that route and its stub entirely, so the suite reports
      # 647 passed / 0 failed / 0 ignored. Identity is
      # served natively by the crate - there is no PocketBase to reach at runtime.
      #
      # THE FIGURE IS PINNED, not remembered. This comment carried a count dated
      # 2026-09-30 and kept carrying it through several bumps, because the check
      # that holds every other stated count - website/tests/doc-counts.test.ts -
      # did not read this file. It does now. The retired number is deliberately
      # NOT quoted here: naming it would put a stale count back into the file,
      # and the guard that rejects retired figures elsewhere would reject it here
      # the moment this file joins that list.
      - name: Integration tests (bundled SQLite)
        working-directory: server
        run: cargo test --lib

      # The deployable artifact must BUILD, and it must RUN.
      #
      # This step exists because the Dockerfile did not, until W17: deployment
      # step [3] named a server image that had no definition anywhere in the
      # repository, so nothing could have caught its absence. A Dockerfile that
      # is never built is the same class of defect as a money check that is never
      # run - it looks like coverage and is not.
      #
      # It BUILDS rather than only linting the syntax, because the failures that
      # actually happened here were build failures: a COPY of a path that does
      # not exist, and a pinned Rust version older than the lockfile's icu_*
      # crates demand. Neither is visible to a linter.
      #
      # WINDOWS CONTRIBUTORS: the smoke step below passes container paths to
      # \`--entrypoint\`, and Git Bash rewrites \`/usr/local/bin/...\` into a
      # \`C:/Program Files/Git/...\` path, which fails with "no such file or
      # directory". That is a local-shell artifact and does not affect this
      # workflow (ubuntu-latest). To run it by hand on Windows, set
      # \`MSYS_NO_PATHCONV=1\` first.
      - name: Build the server image
        run: docker build -f server/Dockerfile -t apikita-server:ci .

      # And it must actually SERVE. "The image built" is not "the service runs":
      # the build above would pass with a binary that panics on boot, a config
      # it cannot read, or a database path it cannot open. So this starts the
      # container against a migrated volume and requires the documented health
      # contract - the same one deployment step [4] gates the release on.
      - name: Smoke the server image against a migrated database
        run: |
          set -euo pipefail
          docker volume create apikita-ci-data
          # Step [2] of the deploy pipeline, run through the shipped binary.
          docker run --rm -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /usr/local/bin/apikita-migrate apikita-server:ci
          docker run -d --name apikita-ci-api -p 18080:8080 \
            -v apikita-ci-data:/srv/apikita/server/data apikita-server:ci
          # The container's own HEALTHCHECK must go green. Polling the platform's
          # health status rather than curl-ing the port proves the probe that
          # ships is the probe that works - an unverified healthcheck reports
          # unhealthy on every container and looks like an application fault.
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' apikita-ci-api)
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then
              docker logs apikita-ci-api
              echo "::error::the container reported unhealthy"
              exit 1
            fi
            sleep 2
          done
          status=$(docker inspect --format '{{.State.Health.Status}}' apikita-ci-api)
          if [ "$status" != "healthy" ]; then
            docker logs apikita-ci-api
            echo "::error::container never became healthy (last status: $status)"
            exit 1
          fi
          # And independently confirm the documented body, so a probe that
          # returns 200 for the wrong reason cannot pass.
          docker exec apikita-ci-api busybox wget -qO- http://127.0.0.1:8080/health \
            | grep -q '"database":"connected"'

          # The runtime image must not carry a PACKAGE MANAGER.
          #
          # server/Dockerfile states the rule in its header - "a compiler, a package
          # manager and a shell in the final image are pure attack surface with no
          # operational benefit" - and for a long time it was only two-thirds true: the
          # compilers were gone, but apt/apt-get/dpkg arrive with debian:bookworm-slim and
          # nothing removed them. The container holds provider credentials and the money
          # database, and a local `dpkg -i` needs no network.
          #
          # This is a REGRESSION GUARD, not a hardening step: the removal is in the
          # Dockerfile, and this fails if a future base change or apt-get brings them back.
          for banned in apt apt-get dpkg; do
            if docker exec apikita-ci-api sh -c "command -v $banned" >/dev/null 2>&1; then
              echo "::error::the runtime image contains $banned; the Dockerfile header calls a package manager pure attack surface"
              exit 1
            fi
          done

          # And it must stay HEALTHY when the upstream providers are unreachable.
          #
          # docs/server/api-spec.md:466-470 states the rule and why: an upstream outage
          # must not look like a dead server and trigger a restart loop. The CI container
          # has no route to any provider either, so this is the real condition rather than
          # a simulation - and the assertion is that a green health is the CORRECT answer
          # here, not a symptom.
          #
          # The opposite direction (a broken database must report degraded) is covered by
          # a unit test with an unreachable pool, health.rs:266, including a leak list.
          # This step is the container-level half that a unit test cannot reach.
          docker exec apikita-ci-api busybox wget -qO- http://127.0.0.1:8080/health \
            | grep -q '"status":"healthy"' \
            || { echo "::error::health is not healthy with no upstream reachable - an upstream outage must not read as a dead server"; exit 1; }

          # And the route table it serves must be the one we documented.
          #
          # The health poll above proves ONE endpoint. This proves the rest: every
          # protected route must REFUSE an anonymous request with the documented error
          # model, an unknown path must 404, and the routes the spec marks
          # DESIGNED-NOT-BUILT must 404 rather than half-exist.
          #
          # A router test cannot cover this. Those drive the handler in-process and share
          # the router - but they do not exercise the binary booting, reading its config,
          # binding a listener, or assembling the middleware chain in main.rs. That is the
          # seam these probes sit on, and it is the last one between the code and a
          # customer.
          echo "--- anonymous surface ---"
          fail=0
          # BusyBox wget has NO --method flag (it rejects it outright with "unrecognized
          # option"), so GET is the default and POST is expressed with --post-data. Using
          # --method here made every probe report "unrecognized" and would have failed the
          # step on EVERY run - found by executing this helper against a live container
          # rather than trusting it to be right.
          status_of() {
            method="$1"; path="$2"
            if [ "$method" = "POST" ]; then
              docker exec apikita-ci-api busybox wget -qO- --server-response \
                --post-data="" "http://127.0.0.1:8080$path" 2>&1
            else
              docker exec apikita-ci-api busybox wget -qO- --server-response \
                "http://127.0.0.1:8080$path" 2>&1
            fi | grep -m1 '^  HTTP/' | awk '{print $2}'
          }
          check_route() {
            want="$1"; method="$2"; path="$3"
            got=$(status_of "$method" "$path")
            if [ "$got" != "$want" ]; then
              echo "::error::$method $path returned '$got', expected $want"
              fail=1
            fi
          }
          check_route 200 GET  /health
          check_route 401 GET  /api/me
          check_route 401 GET  /api/usage
          check_route 401 GET  /api/keys
          check_route 401 GET  /api/export
          check_route 401 GET  /api/topups
          # /api/telegram is registered for DELETE only, so GET is 405 - the method is
          # wrong, which is a different fact from being unauthenticated. Asserting 401
          # here was MY error, caught by running the helper against a live container.
          #
          # DELETE itself is NOT probed: BusyBox wget can send GET and POST and nothing
          # else, so the probe cannot express it. Leaving it in asserted 405 against a
          # 401 expectation and failed - the tool's limitation, not the server's, and a
          # step that fails for a harness reason is worse than one that omits the case.
          check_route 405 GET  /api/telegram
          check_route 401 GET  /events
          # The admin surface must refuse without a session. 401 rather than 403 is
          # correct: the operator flag cannot be known before identity is.
          check_route 401 GET  /api/admin/accounts
          check_route 401 GET  /api/admin/metrics
          check_route 401 POST /v1/chat/completions
          # Unrouted paths are 404, not 401 - a route that does not exist must not
          # pretend to be protected.
          check_route 404 GET  /definitely-not-a-route
          # The api-spec marks these four DESIGNED-NOT-BUILT. Serving them would make
          # the spec wrong; 404 is what it claims.
          # The rest of the mounted table. These six had NO probe: routes the server
          # serves and the workflow never asked about. Expectations come from the CODE and
          # the api-spec, not from the shape of the path.
          check_route 401 GET  /api/admin/audit
          check_route 401 GET  /api/usage/recent
          check_route 401 POST /api/telegram/link-code
          # LOGOUT IS INTENTIONALLY ANONYMOUS AND IDEMPOTENT. auth.rs:388-407 reads the
          # cookie if present, revokes that session, and ALWAYS answers 204 with a cleared
          # cookie - an unauthenticated logout is a no-op, not a leak. The api-spec table
          # lists this group as "cookie / none", the only one that accepts no credential.
          # A 204 here is the contract; asserting 401 would be asserting a bug.
          check_route 204 POST /auth/logout
          check_route 204 POST /auth/logout-all
          # /auth/exchange was the ONE route whose status depended on an external
          # service. The identity port deleted it along with the provider it spoke
          # to, so it must now be an UNMOUNTED path: 404 is what pins the deletion.
          # Asserting 422 here would assert that a route the server no longer
          # serves still exists.
          check_route 404 POST /auth/exchange

          # EVERY error must be the documented JSON - not just "it refused".
          #
          # docs/error-model.md:10 promises "Every error returns the same JSON. No bare HTML
          # error pages, no empty bodies", with a shape of error.code/message/request_id.
          # Measured before this step existed, THREE paths returned something else: an
          # unrouted 404 and the two DESIGNED-NOT-BUILT 404s had EMPTY bodies (axum's default,
          # because the router had no fallback), and a malformed body on an auth verb returned
          # axum's OWN statuses - 400 for a body that is not JSON, 422 for one whose shape does
          # not match, 415 for a missing content type - instead of the documented error JSON.
          #
          # /auth/password-change is where that is now asserted, and it is the right route for
          # it: its handler takes `Result<Json<T>, JsonRejection>` and maps the rejection
          # itself, so those three axum responses all arrive as ONE shape. The mapping is
          # pinned in the crate by
          # routes::auth::tests::live_password_change_body_rejections_all_carry_the_documented_shape,
          # which sends these same two bytes through the real router.
          #
          # The check asserts the SHAPE, which is what the contract is about. The `message`
          # text may change freely; `code` and `request_id` may not.
          # CURL FROM THE HOST, not wget from inside the container. BusyBox wget DISCARDS the
          # body of a non-2xx response and prints "wget: server returned error: HTTP/1.1 404",
          # so a shape check built on it sees its own client message and can never read an error
          # body at all - it would fail on every run and report nothing useful. Measured before
          # choosing: the same requests through curl return the JSON. The port is published
          # below and curl is preinstalled on ubuntu-latest.
          err_shape_ok() {
            # $1 = method, $2 = path, $3 = optional body
            if [ "$1" = "POST" ]; then
              out=$(curl -s -X POST -H 'Content-Type: application/json' -d "$3" \
                "http://127.0.0.1:18080$2" 2>&1)
            else
              out=$(curl -s "http://127.0.0.1:18080$2" 2>&1)
            fi
            case "$out" in
              *'"code"'*) ;;
              *) echo "::error::$1 $2 did not return the documented error shape (no code): $out"; fail=1 ;;
            esac
            case "$out" in
              *'"request_id"'*) ;;
              *) echo "::error::$1 $2 did not return a request_id: $out"; fail=1 ;;
            esac
          }
          err_shape_ok GET  /definitely-not-a-route ""
          err_shape_ok GET  /api/reviews/mine ""
          err_shape_ok GET  /api/me ""
          err_shape_ok GET  /api/admin/accounts ""
          err_shape_ok POST /auth/password-change '{}'
          err_shape_ok POST /auth/password-change '{,}'
          err_shape_ok POST /api/reviews '{"rating":9}'
          check_route 404 POST /api/bot/account
          check_route 404 POST /api/bot/notify-topup

          # The public reviews aggregate used to be asserted 404 here, because the review
          # flow was bot-driven and the bot was not built. It is SERVED now: the customer's
          # own session writes reviews and the aggregate is public, so the check is the
          # opposite one. `average` must be JSON null rather than 0 on an empty database -
          # "nobody has reviewed us" and "everybody gave us zero stars" are different facts
          # and only one of them is representable in a number.
          check_route 200 GET /api/reviews
          out=$(curl -s "http://127.0.0.1:18080/api/reviews" 2>&1)
          case "$out" in
            *'"average":null'*) ;;
            *) echo "::error::GET /api/reviews on an empty database must report a null average, got: $out"; fail=1 ;;
          esac
          # And the write path is session-scoped: no cookie must be 401, never a write.
          check_route 401 POST /api/reviews

          # The BOT endpoint is BUILT, and it is the one route with a different auth
          # scheme (bot token, not cookie, not API key). It is also the endpoint
          # docs/architecture/identity.md calls "the highest-risk endpoint in the
          # Telegram surface": a 6-digit code is 10^6 possibilities.
          #
          # The property under test is ORDERING, and it is a security property rather
          # than a status code: telegram.rs:331-335 checks the credential BEFORE the
          # code shape, so an unauthenticated caller "learns nothing at all, not even
          # whether their input was well formed". A refactor that swapped those two
          # would leave every unit test green while turning the endpoint into an oracle
          # for which codes are well formed.
          #
          # So the assertion is not "it refuses" - it is "it refuses IDENTICALLY".
          bot_refusal() {
            docker exec apikita-ci-api busybox wget -qO- --header='Content-Type: application/json' \
              --post-data="$1" http://127.0.0.1:8080/api/bot/link 2>&1
          }
          bot_status() {
            docker exec apikita-ci-api busybox wget -qO- --server-response \
              --header='Content-Type: application/json' --post-data="$1" \
              http://127.0.0.1:8080/api/bot/link 2>&1 \
              | grep -m1 '^  HTTP/' | awk '{print $2}'
          }
          status_ok=$(bot_status '{"code":"123456"}')
          status_bad=$(bot_status '{"code":"notacode"}')
          if [ -z "$status_ok" ] || [ -z "$status_bad" ]; then
            echo "::error::could not read a status from /api/bot/link (got '$status_ok' / '$status_bad')"
            fail=1
          elif [ "$status_ok" != "$status_bad" ]; then
            echo "::error::/api/bot/link answers DIFFERENTLY for a well-formed and a malformed code with no credential ($status_ok vs $status_bad) - the credential must be checked before the shape"
            fail=1
          fi
          body_ok=$(bot_refusal '{"code":"123456"}')
          body_bad=$(bot_refusal '{"code":"notacode"}')
          if [ "$body_ok" != "$body_bad" ]; then
            echo "::error::/api/bot/link leaks the code shape in its refusal body"
            fail=1
          fi
          # And the refusal must carry the documented error model, request_id included,
          # or a client cannot report which request failed.
          docker exec apikita-ci-api busybox wget -qO- http://127.0.0.1:8080/api/me \
            | grep -q '"code":"unauthenticated"' \
            || { echo "::error::the 401 body is not the documented error model"; fail=1; }
          docker exec apikita-ci-api busybox wget -qO- http://127.0.0.1:8080/api/me \
            | grep -q '"request_id":"req_' \
            || { echo "::error::the 401 body carries no request_id"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "::error::the booted binary does not serve the documented route table"
            exit 1
          fi
          docker rm -f apikita-ci-api
          # Cleanup is BEST-EFFORT and must never fail the step: the volume is
          # scratch and a leftover one on a fresh CI runner is harmless. The
          # `--rm` containers can hold it for a moment after they exit, so the
          # final removal is allowed to fail.
          docker volume rm apikita-ci-data >/dev/null 2>&1 || true


      # The maintenance scheduler must actually RUN.
      #
      # This step exists because it did not, and nothing said so. `next_run_epoch`
      # called GNU `date -u -d "today 3:00"`; the image is Alpine, so `date` is
      # BUSYBOX date, which rejects that form with
      #   date: invalid date 'today 3:00'
      # The nightly loop therefore exited 2 on its FIRST iteration and Compose
      # restart-looped it forever - the retention sweep and the Gate 2 money check
      # could never have run. Every existing test used a ONE-SHOT verb
      # (retention/reconcile/once), which skips `next_run_epoch` entirely, so a
      # loop that could never execute looked exercised.
      #
      # So this checks BOTH halves: the loop can COMPUTE a next run (the actual
      # bug), and the wired verbs still DO their work.
      - name: Smoke the maintenance scheduler image
        run: |
          set -euo pipefail
          docker build -f .docker/maintenance/Dockerfile -t apikita-scheduler:ci .

          # The entrypoint is MOUNTED at runtime, exactly as docker-compose.yml
          # does it - it is NOT baked into the image, so running the image without
          # this mount would exercise nothing.
          RUN="docker run --rm"
          MOUNT="-v $PWD/.docker/maintenance/entrypoint.sh:/usr/local/bin/maintenance-entrypoint.sh:ro"
          REC="-v $PWD/tools/reconcile:/usr/local/share/reconcile:ro"
          # The alert jobs get the SAME mounts docker-compose.yml gives them. If the two
          # sets drift apart, CI passes on a layout no deployment uses - which is how
          # W49's three wiring faults each survived a green host check.
          ALERT="-v $PWD/tools:/srv/apikita/tools:ro"
          ALERT_ENV="-e ALERT_DIR=/srv/apikita/tools/alert -e ALERT_STATE_DIR=/srv/apikita/server/data/alert-state -e RELAY_HOST=nginx -e WEBHOOK_URL="
          ENV="-e DATABASE_URL=sqlite://data/server.db -e RECONCILE_DATABASE_URL=sqlite://data/server.db -e APP_DIR=/srv/apikita"
          EP=/usr/local/bin/maintenance-entrypoint.sh

          docker volume create apikita-ci-data

          # 1: the loop must compute a next run. `schedule` is a 24h loop, so run
          # it under a timeout and require the next-run line rather than waiting.
          timeout 20 $RUN $MOUNT $ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP schedule > /tmp/schedule.log 2>&1 || true
          cat /tmp/schedule.log
          if grep -q "could not compute the next run time" /tmp/schedule.log; then
            echo "::error::the nightly loop cannot compute a next run time"
            exit 1
          fi
          grep -q "next run in" /tmp/schedule.log || {
            echo "::error::the nightly loop never reached its first wait"
            exit 1
          }

          # 2: the wired verbs must still do their work. Seed the minimum schema
          # the sweep touches plus one row PAST the window, then require the sweep
          # to report success AND to have actually deleted it - a query that
          # silently matches nothing (the failure mode a bare-date cutoff vs an
          # RFC3339 timestamp would cause) is caught by the row count, not by the
          # exit code alone.
          $RUN -v $PWD/.docker/maintenance/ci/scheduler-smoke-seed.sql:/seed.sql:ro \
            -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci \
            -c 'sqlite3 /srv/apikita/server/data/server.db < /seed.sql'

          before=$($RUN -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci \
            -c 'sqlite3 /srv/apikita/server/data/server.db "SELECT COUNT(*) FROM usage_events;"')
          out=$($RUN $MOUNT $REC $ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP retention)
          echo "$out"
          echo "$out" | grep -q "job retention: OK" || {
            echo "::error::the retention sweep did not report success"
            exit 1
          }
          after=$($RUN -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci \
            -c 'sqlite3 /srv/apikita/server/data/server.db "SELECT COUNT(*) FROM usage_events;"')
          if [ "$before" = "$after" ]; then
            echo "::error::the sweep reported OK but deleted nothing ($before -> $after)"
            exit 1
          fi

          # 3: hold-sweep. THE gap this step exists for: a stranded reservation hold
          # is INVISIBLE MONEY - the ledger balances and reconcile.sh is structurally
          # blind to it - so the scheduler must actually detect one, not merely claim to.
          #
          # The fixture seeds BOTH a stranded hold and a HEALTHY (paired) reservation.
          # The distinction is the test: a detector that fires on both is noise, and one
          # that fires on neither is absent.
          $RUN -v $PWD/.docker/maintenance/ci/hold-sweep-smoke-seed.sql:/seed.sql:ro \
            -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci \
            -c "sqlite3 /srv/apikita/server/data/server.db < /seed.sql"

          out=$($RUN $MOUNT $ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP hold-sweep 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "job hold-sweep: ALERT" || {
            echo "::error::hold-sweep did not detect the seeded stranded hold"
            exit 1
          }
          echo "$out" | grep -q "reserve_stranded" || {
            echo "::error::hold-sweep did not NAME the stranded ref; a count nobody can act on is half an alert"
            exit 1
          }
          # The HEALTHY reservation must NOT be reported, or the detector fires on
          # normal operation.
          if echo "$out" | grep -q "reserve_healthy"; then
            echo "::error::hold-sweep reported a HEALTHY paired reservation as stranded"
            exit 1
          fi
          # Exit non-zero when it found something: the scheduler must FAIL, not
          # report a clean sheet over unaccounted money.
          rc=0
          $RUN $MOUNT $ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP hold-sweep >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::hold-sweep exited 0 while a stranded hold was present"
            exit 1
          fi
          # And the banner must say it is WIRED - a stale banner is how the previous
          # gap survived: the loop was broken and every test used a verb that skipped it.
          $RUN $MOUNT $ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP hold-sweep 2>&1 \
            | grep -q "WIRED     hold-sweep" || {
            echo "::error::the startup banner does not report hold-sweep as WIRED"
            exit 1
          }
          # 4: the ALERT jobs. Added in W48/W49 and exercised by nothing until now.
          #
          # WHY THIS IS THE RIGHT PLACE AND NOT A NEW STEP. The host-side
          # `alert-check` validates the transport and is thorough, but every actual
          # failure in these jobs was a CONTAINER-INTEGRATION seam that CANNOT occur on
          # the host: on the host the paths resolve and 127.0.0.1 is real. Three of
          # them were found by hand - a false api_down against the container's own
          # loopback, check-alerts.sh resolving its sibling through $SCRIPT_DIR/../..,
          # and the DATABASE_URL vs RECONCILE_DATABASE_URL split. A green host check
          # was true in all three cases. So this asserts the wiring, in the container,
          # with the compose mounts.
          #
          # The database is left as step 3 seeded it, which is enough: these jobs must
          # reach a VERDICT, and the failure being guarded is a wiring error that stops
          # them before any verdict is possible.

          # 4a: the database-backed checks must RUN, not crash on a missing mount.
          out=$($RUN $MOUNT $REC $ALERT $ENV $ALERT_ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP alerts 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "job alerts: start" || {
            echo "::error::the alerts job never started - the alert mounts are missing from this step"
            exit 1
          }
          # A verdict, not a crash. NOT RUN is the exit-6 path ("a check that could not
          # run is not a check that passed"), and it is exactly what a bad mount produces.
          if echo "$out" | grep -q "job alerts: NOT RUN"; then
            echo "::error::the alerts job could not reach a verdict - check-alerts.sh ran but something it needs is not mounted"
            exit 1
          fi
          echo "$out" | grep -q "check-alerts: OK\|check-alerts: ALERT\|job alerts: CLEAN\|job alerts: FIRED" || {
            echo "::error::the alerts job produced no recognisable verdict"
            exit 1
          }
          # The run must not claim a channel it does not have: WEBHOOK_URL is EMPTY here.
          echo "$out" | grep -q "NO CHANNEL IS CONFIGURED" || {
            echo "::error::with no channel configured the run must SAY so - an unmonitored stack reported as monitored is the W52 defect"
            exit 1
          }

          # 4b: the HTTP probes. THE assertion is the one W49 got wrong.
          #
          # probe.sh defaults PROBE_API_URL to 127.0.0.1:8080, which INSIDE a container
          # is its own loopback: nothing is listening, so an unselected check fires a
          # FALSE api_down and the job exits non-zero every night. W49 measured exactly
          # that. So with PROBE_API_URL unset the check must be SKIPPED AND NAMED, and
          # a blanket api_down alert is a regression.
          out=$($RUN $MOUNT $REC $ALERT $ENV $ALERT_ENV -v apikita-ci-data:/srv/apikita/server/data \
            --entrypoint /bin/sh apikita-scheduler:ci $EP alert-probes 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "job alert-probes: start" || {
            echo "::error::the alert-probes job never started"
            exit 1
          }
          echo "$out" | grep -q "SKIPPED - api_down" || {
            echo "::error::api_down was not explicitly skipped - with PROBE_API_URL unset, probe.sh falls back to the container loopback and fires a false breach (W49)"
            exit 1
          }
          if echo "$out" | grep -q "ALERT api_down"; then
            echo "::error::api_down FIRED with no PROBE_API_URL set - that is the false alarm W49 fixed, aimed at the container's own loopback"
            exit 1
          fi
          # relay_down IS selected, and with no relay on this network it must report the
          # failure rather than pass. A probe that cannot fail is not a probe.
          echo "$out" | grep -q "relay_down enabled" || {
            echo "::error::relay_down was not selected - the relay check is the one that CAN run here"
            exit 1
          }

          # Cleanup is BEST-EFFORT and must NEVER fail the step. The volume is
          # scratch, and the daemon can still hold it for a moment after the
          # `--rm` containers exit, so the removal is allowed to fail.
          docker volume rm apikita-ci-data >/dev/null 2>&1 || true

# The edge relay must actually STREAM SSE.
      #
      # docs/edge-relay.md:110 - "A relay that buffers SSE is worse than no relay -
      # the UI silently stops updating." The failure answers 200 and looks connected,
      # so nothing else in this workflow would notice. Nothing looked at relay.conf
      # at all before this step.
      #
      # BOTH halves run: the text check (are the directives present on both streaming
      # locations) and the behavioural one (do they DO what the doc claims). A typo in
      # a directive name passes a grep and still buffers, so they are different
      # failures and both matter.
      - name: Check the edge relay streams SSE
        run: |
          set -euo pipefail
          sh tools/relay-check/check.sh
          sh tools/relay-check/behaviour.sh

      # The deployment definition must parse AND hold its documented invariants.
      #
      # docker-compose.yml is the file a new operator reads first and `docker compose
      # up -d` obeys, and nothing validated it before this step. Its comments state
      # several invariants as LOAD-BEARING - the scheduler working_dir (any other value
      # makes the Gate 2 money check silently run against nothing), two DSNs that must
      # stay separate, a data mount that must NOT be read-only, the relay config mounted
      # where nginx actually reads it. A config that parses can still be wrong in ways
      # that fail at 03:00 rather than at review time.
      - name: Check the compose deployment definition
        run: sh tools/compose-check/check.sh

      # The backup tool must actually deliver the artifact OFFSITE.
      #
      # It had no CI coverage, and running it found a real defect: the offsite hook was
      # invoked so that a SCRIPT hook received NOTHING while the backup reported
      # success and exited 0. The one outcome the tool exists to prevent - a backup
      # that never left the machine - was reachable through the ordinary hook shape.
      #
      # It was invisible because the README example used the INLINE form, which worked.
      - name: Check the backup contract
        run: sh tools/backup-check/check.sh

      # The Gate 2 money check must actually RUN and actually FAIL on drift.
      #
      # docs/launch-checklist.md:277 calls tools/reconcile/reconcile.sh "the single best
      # guard against silently wrong money". It was MOUNTED into the scheduler smoke and
      # thus reachable - which is why a path grep found it and it looked covered - but no
      # step ever RAN it. A mounted tool is not a run tool.
      #
      # The check proves the direction that matters: a drifted wallet/ledger fails AND
      # names the account, while a consistent one passes. Mutation-tested against the SQL.
      - name: Check the reconciliation gate
        run: sh tools/reconcile-check/check.sh

      # The restore drill must refuse every live-looking target BEFORE deleting anything.
      #
      # The drill DELETES a scratch database as part of teardown, and its safety guard is
      # the only thing between that and production. docs/launch-checklist.md:279 says an
      # untested backup is a belief - and the tool that produces the restore evidence was
      # covered by nothing in CI.
      #
      # Both directions are asserted: the guard refuses and touches nothing, a consistent
      # source drills to PASS, and a drifted one FAILS.
      - name: Check the restore drill
        run: sh tools/drill-check/check.sh

      # The ROLLBACK drill must refuse live-looking targets, must FAIL on a deliberately
      # wrong schema version, and must exit 8 - not 0 - when the bad migration it applies
      # damages nothing a check can see.
      #
      # The restore drill proves a BACKUP restores. It restores a matched source/artifact
      # pair, so it cannot show the thing a rollback depends on: that a snapshot taken
      # BEFORE a migration still yields a usable database AFTER that migration went wrong,
      # on the schema the old binary expects. That is the whole content of the last
      # rollback row in docs/ci-cd.md, and until this tool existed nothing exercised it.
      #
      # Its check is honest about its own limits: read the KNOWN-UNCOVERED block at the top
      # of check.sh. Four of the drill's assertions are covered by reading, not by this
      # step, and saying so is the point - a check whose README implied total coverage
      # would be the defect these directories exist to catch.
      - name: Check the rollback drill
        run: sh tools/rollback-check/check.sh

      # The alert tool must DELIVER, and must not silence its own retry.
      #
      # Every other gate detects a problem; this one has to tell someone. It had no CI
      # coverage, and its contract has deliberate distinctions a tidy-up can collapse:
      # a throttled alert is exit 1 NOT 0, and the cooldown is recorded only AFTER the
      # channel accepted - otherwise a failed delivery silences that incident for the
      # whole window and nothing says so.
      #
      # The ordering property is tested by attempting twice against a failing channel and
      # asserting BOTH attempts were made. Hermetic: the file channel, no network.
      - name: Check the alert delivery contract
        run: sh tools/alert-check/check.sh

      # The wind-down payout report must classify, divide and REFUSE correctly.
      #
      # It is the read-only half of the closure runbook, and every number it prints is a
      # number an operator will act on by hand - there is no treasury and no automation
      # downstream to catch a mistake. Three distinctions a tidy-up can collapse:
      # the payout threshold is STRICTLY greater (a balance of exactly 2x the frozen rate
      # is sub-threshold), stablecoin units FLOOR rather than round, and the frozen rate
      # must be SUPPLIED - looking it up live at closure would price the runbook against a
      # rate that has moved since the decision to close.
      #
      # The check asserts each refusal returns its OWN exit code, because a detector that
      # cannot fail is not a detector. It runs against a scratch database and verifies the
      # report leaves that database byte-identical.
      - name: Check the wind-down payout report
        run: sh tools/wind-down-check/check.sh

      # The CI document must describe the pipeline that actually runs.
      #
      # docs/ci-cd.md listed TEN stages while the workflow ran TWENTY-SIX: the seven
      # tool-contract checks above were absent from the one document a reader consults to
      # answer "what will stop my PR?". An understated pipeline teaches people to work
      # around CI, so the table is checked rather than trusted.
      - name: Check the CI documentation
        run: sh tools/ci-docs-check/check.sh

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      # The project ships no `typescript` on disk; the pinned npx form is what
      # the typecheck gate already uses locally.
      - name: Typecheck (website)
        working-directory: website
        run: npx --yes -p typescript@5.6 tsc --noEmit -p tsconfig.json

      - name: Website contract tests
        working-directory: website
        run: node --test 'tests/**/*.test.ts'

      - name: Build website
        working-directory: website
        run: npm run build

      # A floor, not a full scanner: enough to catch the two mistakes that reach
      # history most often. docs/ci-cd.md leaves the tool open.
      - name: Secret scan
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked; it must stay out of git"
            exit 1
          fi
          if git grep -nE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::a private key is committed"
            exit 1
          fi
