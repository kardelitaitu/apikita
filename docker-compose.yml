# apikita — local development stack.
#
#   cp .env.example .env && docker compose up -d
#
# Postgres is money, PocketBase is identity, nginx is the edge relay.
# Ports and the fake-provider strategy: docs/local-development.md.
# Relay behaviour: docs/edge-relay.md. Migrations: .docker/postgres/README.md.
#
# No top-level `version:` key — obsolete in Compose v2+.

services:
  # ---------------------------------------------------------------------------
  # Money. Schema lives in server/migrations and is applied automatically on the
  # FIRST boot of an empty volume (see .docker/postgres/README.md).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: apikita-postgres
    environment:
      POSTGRES_DB: apikita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # /docker-entrypoint-initdb.d runs *.sql once, on first boot only.
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apikita"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Identity only. Holds no money: balances and ledger are in Postgres.
  # ---------------------------------------------------------------------------
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: apikita-pocketbase
    command: ["serve", "--http=0.0.0.0:8090"]
    ports:
      - "8090:8090"
    volumes:
      - pbdata:/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Edge relay. Proxies to the Rust API running on the HOST (cargo run --bin api),
  # which is why the upstream is host.docker.internal:8080 and not a service name.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: apikita-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./.docker/nginx/relay.conf:/etc/nginx/conf.d/default.conf:ro
    # Linux hosts need the gateway alias for host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Wait for a migrated database before accepting traffic.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  pbdata:
