# apikita — local development stack.
#
#   cp .env.example .env && docker compose up -d
#
# nginx is the edge relay; it proxies to the Rust API running on the HOST.
# Ports and the fake-provider strategy: docs/local-development.md.
# Relay behaviour: docs/edge-relay.md.
#
# There is no database container. The API uses embedded SQLite at the path in
# DATABASE_URL (default sqlite://data/server.db) — a file on this host, not a
# service. Postgres and the PocketBase container were removed by the SQLite
# migration (docs/plans/sqlite-migration.md); PocketBase returns as a Rust
# implementation in Phase 6, and it will not be a container either.
#
# Resetting the local database is now a file operation, not a volume:
#   rm -f data/server.db data/server.db-wal data/server.db-shm
# then re-run the migrate binary. The old postgres reset
# (`docker compose down -v`) no longer touches any data.
#
# No top-level `version:` key — obsolete in Compose v2+.

services:
  # ---------------------------------------------------------------------------
  # Edge relay. Proxies to the Rust API running on the HOST (cargo run --bin api),
  # which is why the upstream is host.docker.internal:8080 and not a service name.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: apikita-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./.docker/nginx/relay.conf:/etc/nginx/conf.d/default.conf:ro
    # Linux hosts need the gateway alias for host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on: there is no database service left to wait for. The API runs
    # on the host, so this healthcheck reports unhealthy until it is started.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
