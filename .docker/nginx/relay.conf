# apikita edge relay — LOCAL DEVELOPMENT.
#
# ONE ORIGIN. Production splits the two halves: Cloudflare Pages serves the
# static site and Northflank runs the API (docs/architecture.md:12-18), so there
# the cookie question is a subdomain question. Locally they are ONE origin on
# :8000 — the built site from a read-only mount, the API by proxy — because that
# is the only local shape in which the browser will send the session cookie
# (docs/local-development.md, "Cookie domains are the trap"). Same relay, same
# production contract (docs/edge-relay.md); only the site's origin changes.
#
# The relay does no business logic: no billing, no auth decisions, no body
# modification, and it must never log keys or bodies (docs/data-retention.md).

upstream apikita_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

# Flood protection, not policy — the backend enforces the real limits.
# Numbers: docs/edge-relay.md:114-124.
limit_req_zone  $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_zone  $http_authorization zone=perkey:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 8000;
    server_name _;

    # The static site: the build output itself, bind-mounted read-only from the
    # host (docker-compose.yml). NOT a copy baked into the image — a copy is how
    # you end up serving yesterday's JS without noticing. Build it first:
    #   cd website && PUBLIC_API_BASE_URL= npm run build
    root  /srv/www;
    index index.html;

    # Relay-side request size cap. The production value is a sizing decision
    # (docs/cost-and-sizing.md); nginx's 1m default would reject long contexts.
    client_max_body_size 25m;

    # Never persist keys or bodies.
    access_log off;

    limit_req  zone=perip burst=60 nodelay;
    limit_conn connperip 50;

    # Proxy defaults, inherited by every location below that does not override
    # them. INHERITANCE IS ALL-OR-NOTHING PER DIRECTIVE: a location that sets
    # ANY proxy_set_header stops inheriting ALL of these. Do not add a single
    # proxy_set_header to a location — repeat the whole set or hoist it here.
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    # Empty Connection enables the keepalive pool above; it is also what keeps
    # an SSE stream open.
    proxy_set_header        Connection '';
    proxy_read_timeout      60s;

    # Answered by the relay itself; used by the compose healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # =======================================================================
    # THE API SLICE — exactly these paths leave the relay for the backend.
    # Everything NOT listed here is served as a static file, so this list is
    # the whole contract: an API route missing from it 404s loudly instead of
    # being silently answered with a page.
    # =======================================================================

    # SSE live updates. proxy_buffering off is THE critical line: a relay that
    # buffers SSE looks connected while the dashboard silently stops updating.
    # docs/edge-relay.md:88-112.
    location /events {
        limit_req zone=perkey burst=200 nodelay;

        proxy_pass              http://apikita_backend;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
        gzip                    off;
    }

    # LLM proxy. Streams token deltas, so it needs the same unbuffered treatment
    # as /events — a buffered stream is a truncated answer the client never sees.
    location /v1/ {
        limit_req zone=perkey burst=200 nodelay;

        proxy_pass              http://apikita_backend;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
        gzip                    off;
    }

    # Session exchange and logout (/auth/exchange, /auth/logout*). Buffered.
    location /auth/ {
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Dashboard data: /api/me, /api/usage, /api/keys, /api/topups, /api/admin/*.
    location /api/ {
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Midtrans callbacks. Not browser traffic, but the same backend.
    location /webhooks/ {
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Backend liveness. Exact match, so it can never collide with /healthz
    # above or with a static file named /health.
    location = /health {
        proxy_pass http://apikita_backend;
    }

    # =======================================================================
    # THE STATIC SITE — everything else.
    #
    # This build is MULTI-PAGE (astro output:'static'), so =404 is the correct
    # ending and an index.html fallback is a BUG: it turns every typo and every
    # deleted page into a 200 of the landing page, hiding exactly the 404s you
    # need to see. Unknown paths must 404.
    # =======================================================================
    location / {
        try_files $uri $uri/ =404;
    }
}
