# apikita edge relay — LOCAL DEVELOPMENT.
#
# ONE ORIGIN. Production splits the two halves: Cloudflare Pages serves the
# static site and Northflank runs the API (docs/architecture.md:12-18), so there
# the cookie question is a subdomain question. Locally they are ONE origin on
# :8000 — the built site from a read-only mount, the API by proxy — because that
# is the only local shape in which the browser will send the session cookie
# (docs/local-development.md, "Cookie domains are the trap"). Same relay, same
# production contract (docs/edge-relay.md); only the site's origin changes.
#
# The relay does no business logic: no billing, no auth decisions, no body
# modification, and it must never log keys or bodies (docs/data-retention.md).

upstream apikita_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

# Flood protection, not policy — the backend enforces the real limits.
# Numbers: docs/edge-relay.md:114-124.
#
# THE `perkey` KEY IS `$http_authorization`, AND AN EMPTY KEY DISABLES THE LIMIT. That is nginx's
# documented behaviour: when the zone key evaluates to an empty string, `limit_req` passes the
# request through WITHOUT counting it. Every API location below named `zone=perkey` and nothing
# else, and `limit_req` is REPLACE-not-merge — a location naming a zone discards the `perip`
# directive it would otherwise inherit from the server block. So the API locations inherited
# nothing, and their only limit was keyed on a header an unauthenticated caller does not send:
#
#   MEASURED, in a real nginx with this file (perip and perkey both tightened to 1 r/s, burst 2,
#   so a working limit 503s within three requests):
#     /v1/chat       no Authorization  -> 200 200 200 200 200 200 200 200   UNLIMITED
#     /auth/login    no Authorization  -> 200 200 200 200 200 200 200 200   UNLIMITED
#     /webhooks/     no Authorization  -> 200 200 200 200 200 200 200 200   UNLIMITED
#     /v1/chat       with Authorization-> 200 200 200 503 503 503 503 503   limited
#     /nonexistent   (no own limit_req)-> 404 404 503 503 503               perip inherited
#
# The comparison is the finding: a location that names no zone still gets perip, so the server
# block's own directive is live. The four that name `perkey` lost it. The intent was a two-tier
# limit; the effect was that the tier a FLOOD would use did not exist, and the one that did apply
# only applied to callers who identified themselves. `/auth/login` unlimited is credential
# stuffing surface; `/webhooks/` unlimited is a payment-endpoint flood.
#
# SO EVERY API LOCATION NAMES BOTH ZONES. nginx evaluates every `limit_req` directive a location
# carries, so an unauthenticated request is bounded by `perip` and an authenticated one by both.
# Re-verified with the same harness: all four rows 503 after the burst.
limit_req_zone  $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_zone  $http_authorization zone=perkey:10m rate=100r/s;
# Midtrans callbacks are NOT browser traffic and are NOT throttled like it. They arrive from the
# payment provider's own addresses, which may be few, and a 503 on this path is a MISSED CREDIT -
# the backend is never asked and the money is not recorded. So the webhook gets its own, far more
# generous per-IP zone rather than the 30 r/s intended for a human's browser: high enough that a
# legitimate retry storm is never refused, low enough that one host cannot flood the endpoint.
limit_req_zone  $binary_remote_addr zone=perwh:10m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 8000;
    server_name _;

    # The static site: the build output itself, bind-mounted read-only from the
    # host (docker-compose.yml). NOT a copy baked into the image — a copy is how
    # you end up serving yesterday's JS without noticing. Build it first:
    #   cd website && PUBLIC_API_BASE_URL= npm run build
    root  /srv/www;
    index index.html;

    # Relay-side request size cap. The production value is a sizing decision
    # (docs/cost-and-sizing.md); nginx's 1m default would reject long contexts.
    client_max_body_size 25m;

    # Never persist keys or bodies.
    access_log off;

    limit_req  zone=perip burst=60 nodelay;
    limit_conn connperip 50;

    # Proxy defaults, inherited by every location below that does not override
    # them. INHERITANCE IS ALL-OR-NOTHING PER DIRECTIVE: a location that sets
    # ANY proxy_set_header stops inheriting ALL of these. Do not add a single
    # proxy_set_header to a location — repeat the whole set or hoist it here.
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    # Empty Connection enables the keepalive pool above; it is also what keeps
    # an SSE stream open.
    proxy_set_header        Connection '';
    proxy_read_timeout      60s;

    # Answered by the relay itself; used by the compose healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # =======================================================================
    # THE API SLICE — exactly these paths leave the relay for the backend.
    # Everything NOT listed here is served as a static file, so this list is
    # the whole contract: an API route missing from it 404s loudly instead of
    # being silently answered with a page.
    # =======================================================================

    # SSE live updates. proxy_buffering off is THE critical line: a relay that
    # buffers SSE looks connected while the dashboard silently stops updating.
    # docs/edge-relay.md:88-112.
    location /events {
        # BOTH zones: naming only `perkey` REPLACED the inherited `perip`, and an empty
        # $http_authorization (no header) disables a limit_req entirely. See the
        # limit_req_zone block at the top for the measurement.
        limit_req zone=perip burst=60 nodelay;
        limit_req zone=perkey burst=200 nodelay;

        proxy_pass              http://apikita_backend;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
        gzip                    off;
    }

    # LLM proxy. Streams token deltas, so it needs the same unbuffered treatment
    # as /events — a buffered stream is a truncated answer the client never sees.
    location /v1/ {
        # BOTH zones: naming only `perkey` REPLACED the inherited `perip`, and an empty
        # $http_authorization (no header) disables a limit_req entirely. See the
        # limit_req_zone block at the top for the measurement.
        limit_req zone=perip burst=60 nodelay;
        limit_req zone=perkey burst=200 nodelay;

        proxy_pass              http://apikita_backend;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
        gzip                    off;
    }

    # The auth surface: signup, login, Google sign-in, email verification, the
    # reset pair, resend, and the settings verbs (password change, providers).
    # These are small JSON requests with no streaming, so they are left BUFFERED.
    # (This comment named /auth/exchange, which the identity port deleted; the
    # location is a prefix and always covered more than the two it listed.)
    location /auth/ {
        # BOTH zones: naming only `perkey` REPLACED the inherited `perip`, and an empty
        # $http_authorization (no header) disables a limit_req entirely. See the
        # limit_req_zone block at the top for the measurement.
        limit_req zone=perip burst=60 nodelay;
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Dashboard data: /api/me, /api/usage, /api/keys, /api/topups, /api/admin/*.
    location /api/ {
        # BOTH zones: naming only `perkey` REPLACED the inherited `perip`, and an empty
        # $http_authorization (no header) disables a limit_req entirely. See the
        # limit_req_zone block at the top for the measurement.
        limit_req zone=perip burst=60 nodelay;
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Midtrans callbacks. Not browser traffic, but the same backend.
    location /webhooks/ {
        # perwh, NOT perip: a 503 here is a missed credit, because the backend is never
        # asked. Midtrans may fan out from few addresses, so this is sized for a provider
        # rather than a browser - still bounded, but an order of magnitude above the
        # human-facing limit. See the limit_req_zone block for the reasoning.
        #
        # perkey stays BESIDE it rather than instead of it: an authenticated callback (none
        # are, today) would still get its own bucketed limit, and the pair is what every
        # other API location does. `perwh` is what bounds the unauthenticated case, since an
        # empty $http_authorization makes the perkey directive pass the request through.
        limit_req zone=perwh burst=1000 nodelay;
        limit_req zone=perkey burst=200 nodelay;
        proxy_pass http://apikita_backend;
    }

    # Backend liveness. Exact match, so it can never collide with /healthz
    # above or with a static file named /health.
    location = /health {
        proxy_pass http://apikita_backend;
    }

    # =======================================================================
    # THE STATIC SITE — everything else.
    #
    # This build is MULTI-PAGE (astro output:'static'), so =404 is the correct
    # ending and an index.html fallback is a BUG: it turns every typo and every
    # deleted page into a 200 of the landing page, hiding exactly the 404s you
    # need to see. Unknown paths must 404.
    # =======================================================================
    location / {
        try_files $uri $uri/ =404;
    }
}
