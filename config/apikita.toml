# apikita configuration — SINGLE SOURCE OF TRUTH
#
# Consolidated from the former apikita.toml and models.example.toml, which
# disagreed: no env var names overlapped and .env satisfied only one of them.
# Two configs with the same rates and different keys is a startup failure.
#
# SECRETS: this file names ENVIRONMENT VARIABLES only. Never inline a key.
# The names here must match .env.example exactly.
#
# Deployment: docs/deployment.md · Decisions: docs/decisions.md

# ===========================================================================
# CURRENCY CONVERSION -- READ FIRST
# ===========================================================================
#
#   1 CNY = 2,676.78 IDR
#   source: Google Finance, 24 Sept 21:00 UTC
#
#   The upstream price list is quoted in CNY per 1M tokens. Every IDR figure
#   below is that CNY price x 2,676.78. To re-derive after an FX move:
#
#     IDR_rate = CNY_rate * 2676.78
#
#   RATES DRIFT. We collect IDR and pay CNY, so an FX move changes our cost
#   with no change in the upstream price list. Re-check before repricing, and
#   do not hand-edit the IDR values without updating this line.
#
#   (At USD/IDR 18,000 this implies USD/CNY ~6.72, close to market.)
#

# ===========================================================================
# PRICING AND WALLET
# ===========================================================================

[pricing]
# Margin is set PER MODEL (see [[models]] price = ...), not globally.
# Different models carry different wholesale costs, so one global multiplier
# cannot work: pro-tier output costs ~3.4x flash, and a single rate would make
# one unsellable and the other unprofitable.
#
# There is deliberately NO global default. Every model MUST declare its price,
# so a missing value is a startup error rather than a silent wrong margin.
#
# OPERATIVE MARGIN: M = 1.50 (50% markup over wholesale cost).
# At zero fixed server cost (Cloudflare & Northflank developer tiers), M = 1.50
# delivers competitive pricing in IDR while remaining profitable from Customer #1.

currency = "IDR"

[wallet]
# Re-top-up minimum. Small deposits are cheap to accept via QRIS but each
# one is a support surface; this is a nuisance filter, not a profitability
# filter.
min_topup = 10000

# First deposit minimum. Higher than min_topup deliberately: the first
# deposit is where per-customer support cost is incurred.
min_first_deposit = 50000

# Contribution scales with tokens consumed, not deposit size. A volume gate
# is the only thing that filters a negative-contribution customer.
# Set to 0 to disable.
min_monthly_tokens = 0

# Days of inactivity before an account is treated as dormant (0 = disabled).
# The model has no mechanism for this yet; see docs/business/03-financial-model.md.
dormancy_days = 0

# Upstream prepaid float policy. Hold roughly one settlement cycle of
# unpurchased liability so a provider outage does not stall paid customers.
#
# NOT ENFORCED, and this one is about money: nothing reads this key, so whatever the
# float policy is, it is not this number. The comment describes the reason it would be
# worth having, which is why the value is kept rather than deleted - the intent is the
# useful part, and an unenforced key with a stated intent is a task, whereas an
# unenforced key presented as live is a trap.
reserve_settlement_cycles = 1

# Low-balance warning, sent by the Telegram bot as a DM (never in a shared
# room). Capped so it cannot become spam.
#
# NOT ENFORCED. Neither key is read by anything. There is no low-balance alert in
# tools/alert/alerts.tsv, and the bot has no DM capability, so nothing will be sent and
# nothing will complain that it was not. The comment above used to read as a description
# of a working safety net, and an operator reading it would set a threshold and wait for
# a warning that cannot arrive - about the upstream float running low, which is the case
# where a provider outage stalls paid customers.
#
# The value is kept so the intended policy is recorded, and the same is true of
# reserve_settlement_cycles above. Both are on the worklist produced by the field-access
# measurement described in docs/testing.md: 17 config keys are named somewhere in the
# crate and read as a field access nowhere.
low_balance_threshold_idr = 10000
low_balance_max_per_day = 1

# ===========================================================================
# SESSIONS
# ===========================================================================

[sessions]
# Cookie sessions, stored server-side in SQLite. Logout revokes the row,
# so these are hard bounds rather than advisory.
#
# Absolute: the session dies at this age regardless of activity.
# Idle:     the session dies after this much inactivity.
#
# Shorter bounds limit a stolen cookie; longer bounds mean fewer logins.
# 30d/7d is a deliberate middle for a prepaid financial tool.
absolute_days = 30
idle_days = 7

# ===========================================================================
# RATE LIMITS
# ===========================================================================

[limits]
# Per-account caps. These are abuse guards, not pricing. The per-KEY rate
# limit is separate and set on each api_keys row (rate_limit_rpm).
#
# Edge-level limits live in nginx and are blunter; see docs/edge-relay.md.

# Money path: creates a top-up and a Midtrans session.
topup_per_hour = 5

# Protects the wallet mutation path generally.
#
# NOT ENFORCED, and the word GENERALLY is the part that would mislead. Nothing reads
# this key. What exists is limits.topup_per_hour, enforced on the one caller-controlled
# wallet-mutation route (POST /api/topups) and covered by a test that drives the handler
# at its cap. So today the wallet is protected, but by the specific key on the specific
# route - not by this one. They agree only because that is the only such route: the
# webhook credit is not caller-paced, and the proxy debit is bounded by the balance.
# The moment a second caller-controlled wallet mutation appears, this is the line that
# should be enforcing it and it will not.
wallet_mutations_per_minute = 10

# Blunts limit circumvention by key-spam.
key_creation_per_day = 10

# Review submissions. Edits are legitimate; flooding is not.
#
# NOT ENFORCED, and moot for now only because the review endpoints are marked DESIGNED,
# NOT BUILT in the api-spec. There is nothing to rate limit yet. Whoever builds them
# should read this as a requirement, not as a setting: a review endpoint with no rate
# limit is a moderation problem from its first request, and a body limit alongside it.
review_per_hour = 3

# Telegram link codes the account may have ISSUED in an hour. Bounds codes in
# flight per account; it does NOT stop guessing (see the redemption cap below).
link_code_issuance_per_hour = 10

# Redemption ATTEMPTS one client IP may make in an hour. This is the cap that
# makes the endpoint safe: a 6-digit code is 10^6 possibilities and the endpoint
# refuses without saying whether the code existed, so the security here is how
# few guesses are permitted - not how secret the code is
# (docs/architecture/identity.md: the highest-risk endpoint in the Telegram
# surface). FAILED attempts count, so 0 disables the cap entirely and should
# never be set in production.
link_redemption_per_hour = 20

# How long the proxy caches API key metadata (limits, model allowlist,
# revoked state) before re-reading from SQLite.
#
# This is the window in which a revoked key still works and a lowered limit
# has not applied. Documented in decisions.md as 60s: short enough to bound
# the risk, long enough to keep the database off the request hot path.
key_metadata_cache_seconds = 60

# ===========================================================================
# NETWORK TRUST
# ===========================================================================

[network]
# Reverse proxies allowed to speak for the caller via X-Forwarded-For.
#
# The backend sits behind the edge relay, so the TCP peer is the relay and
# every key would otherwise show one source. Only a peer inside one of these
# networks has its X-Forwarded-For consulted; from anywhere else the header is
# ignored entirely, because a caller who can choose their recorded address can
# hide key sharing — the exact signal docs/ip-tracking.md exists to raise.
#
# THIS DEFAULT IS THE LOCAL DEVELOPMENT STACK ONLY. The relay is an nginx
# container (docker-compose.yml) that proxies to the API on the host, so the
# peer the API observes is a host-side address, not the container's. Verified
# on this machine: the compose bridge is 172.21.0.0/16 (docker network inspect
# apikita_default), the nginx container's own address is 172.21.0.4, and a
# request from that container to a server on the host arrives with peer
# 127.0.0.1 — Docker Desktop publishes it through the host gateway
# (192.168.65.254). So loopback covers both the direct and the relayed path
# here, and 172.21.0.0/16 covers a native Linux daemon, where the container's
# 172.21.0.x address is the peer. The relay has no fixed address, which is why
# the bridge SUBNET is named rather than a single address.
#
# The sweeping RFC1918 ranges that used to sit here (10.0.0.0/8,
# 192.168.0.0/16, 172.16.0.0/12) are gone: they are not what local development
# needs, and per docs/topology.md:39-42 the backend stays directly reachable
# for failover, so "on the private network" is not a security boundary. Any
# co-tenant or dev box in those ranges could set X-Forwarded-For and choose the
# address it is recorded as.
#
# THIS LINE MUST BE SET PER ENVIRONMENT, AND IN PRODUCTION IT MUST NAME THE
# RELAY ONLY — one address, e.g. "203.0.113.7/32", never a range that merely
# contains it. There is no deploy-time injection today: the server reads
# APIKITA_CONFIG_PATH (default "config/apikita.toml", relative to the working
# directory — server/src/main.rs), so production ships its own copy of this
# file with this line replaced. A rule broad enough to include a customer will
# trust a header that customer forged.
#
# server/src/config.rs refuses to start on a default route (0.0.0.0/0, ::/0) or
# on any prefix shorter than /16, so this cannot be widened by accident.
trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128", "172.21.0.0/16"]

# ===========================================================================
# REALTIME (SSE)
# ===========================================================================

[realtime]
# Events replayed to a client that reconnects with Last-Event-ID. Bounded so
# memory cannot grow without limit.
replay_buffer_events = 100

# Concurrent SSE connections per account. One per tab, with headroom.
max_connections_per_account = 5

# Seconds before the server closes a stream so the client reconnects cleanly.
# Intermediaries close idle streams anyway; a planned reconnect beats a
# surprise drop the client has to detect.
max_stream_seconds = 1800

# ===========================================================================
# KEY POOL
# ===========================================================================AND RESILIENCE
# ===========================================================================

[key_pool]
# HTTP status treated as "this key is saturated, rotate to the next".
rate_limit_status = [429]

# Seconds a key stays out of rotation after being throttled. Short: the
# provider's own concurrency window frees up quickly.
key_cooldown_seconds = 5

# Attempts across DIFFERENT keys before giving up on a request. With 3 keys
# this allows up to 3 tries; keep below the pool size or it retries dead keys.
max_key_attempts = 3

# When every key on every healthy endpoint is saturated, what to do.
#   "queue"      - hold the request until capacity frees (needs a queue)
#   "reject_503" - fail fast with Retry-After
# "reject_503" is the honest default for a proxy: the caller can retry.
# RECORDED, NOT A SWITCH. Nothing reads on_pool_exhausted, and the behaviour it
# names is what the code does unconditionally: when no key can be leased the underlying
# error is WITHHELD from the client and surfaced as a 503 with Retry-After
# (routes/proxy.rs). Setting this to fail_open would change nothing, and the key is
# where someone would first try. The same is true of the three keys noted at the health
# check below: health_check_interval_seconds, health_check_failures and
# mid_stream_cutoff. On that last one the value is the CURRENT behaviour and it is
# fortunate rather than coordinated - the pre-flight hold IS taken before routing and
# an insufficient balance IS refused up front (routes/proxy.rs), which is the
# mitigation the key describes, but it happens because the code does it, not because
# this is set to false.
on_pool_exhausted = "reject_503"

[circuit_breaker]
# Consecutive failures before marking a provider unhealthy.
failure_threshold = 3

# Seconds before a tripped provider is retried (the first cooldown).
cooldown_seconds = 30

# On each consecutive failure the cooldown doubles, up to this ceiling.
#
# 30 -> 60 -> 120 -> 240 -> 480 -> 900. After ~5 failures the endpoint is
# retried every 15 minutes: long enough to stop hammering a dead provider,
# short enough that recovery is noticed without a manual restart.
cooldown_max_seconds = 900

# Multiplier applied to the cooldown on each consecutive failure.
# 2.0 means doubling. Set to 1.0 to disable backoff and retry always at
# cooldown_seconds.
cooldown_multiplier = 2.0

# Per-request upstream timeout, seconds.
request_timeout_seconds = 120

# External health check interval for relay/backend failover (see topology.md).
health_check_interval_seconds = 30
# Consecutive failed checks before failing over.
health_check_failures = 2

[streaming]
# On balance exhaustion, reject at pre-flight rather than cutting a stream
# mid-answer. A truncated answer on non-refundable funds is the most likely
# source of a delivery dispute. See docs/business/05-risk.md R3.
mid_stream_cutoff = false

hard_max_output_tokens = 384000

# Context window, for pre-flight input validation.
max_context_tokens = 1000000

# ===========================================================================
# PROVIDERS AND MODELS
# ===========================================================================
#
# ONE VERIFIED PROVIDER, AND ONE PLACEHOLDER THAT IS CURRENTLY ROUTABLE.
# The flash endpoint list below has three entries, and only the first is a real,
# terms-checked supplier:
#
#   primary    - the reseller in config/provider1.md. VERIFIED. weight 1.0.
#   secondary  - PLACEHOLDER URL. No provider identified, terms unread.
#                weight 1.0 - SO IT IS ROUTED. This contradicts the rule stated
#                below, and it is the one thing here that must change before a
#                launch: see the note under FAILOVER below.
#   tertiary   - PLACEHOLDER URL. weight 0, so never routed.
#
# The placeholder URLs are NOT real endpoints. They exist so the config shape
# is visible; replace them before deploying, or delete the entries.
#
# Consequence for failover: with one real provider there is nothing real to fail
# over TO. Circuit breaking and key rotation work today; cross-provider
# failover does not. See docs/failover.md.
#
# A provider must not be enabled until its resale terms are read, and the way
# this file expresses that is weight = 0. IT DOES NOT ENFORCE IT CONSISTENTLY:
# two placeholders are listed, one at weight 0 and one at weight 1.0. There is no
# verified flag to check, so nothing rejects an unverified entry that someone has
# left enabled - the rule is a convention here, not a constraint, and a reader who
# took the old wording at face value would believe the opposite.
#
# FAILOVER, and what weight 1.0 on a placeholder actually does. The router selects
# every endpoint with weight > 0, so on a primary 429 or 5xx the request is offered
# to the secondary. If its key variables are unset it has an EMPTY key pool, the
# failover loop steps past it, and the request fails - no worse than before, but the
# attempt and the timeout are real. If an operator sets APK_FLASH_SECONDARY_KEY_1,
# traffic is then sent to api.xyz.com, which is not the provider.
#
# It also has one more effect that is easy to miss, and the server was fixed for it:
# a weighted endpoint with no keys can never answer, and its circuit breaker never
# trips, so it used to vote "this model is available" in all_providers_unhealthy and
# hide a real outage of the primary. That is corrected in the code
# (upstream/client.rs, an endpoint counts only if it also has keys).
#
# THE FIX, when there is authority to make it, is one line: set this endpoint's
# weight to 0.0. It is left as-is rather than changed here because choosing which
# providers are real is a deployment decision, not a code one.

# ===========================================================================
# MODEL LIST
# ===========================================================================
#
# SOURCE OF TRUTH FOR COST: the provider's own price list (screenshot), which
# quotes CNY per 1M tokens.
#
#   PROVIDER IS A RESELLER, NOT DEEPSEEK DIRECT.
#   Both flash models come in at ~46% of DeepSeek's own list price, verified
#   against the official USD price list. The reseller is a genuine saving.
#
#   Its "Official $..." comparison column is NOT a currency conversion --
#   every ratio in it is exactly 3.33 CNY/USD (market is ~6.7), so the
#   "Save 50%" badge is arithmetic, not a market price. Ignore the badge;
#   the CNY column is what we actually pay.
#
#   SCOPE: flash only. deepseek-v4-pro is deliberately NOT offered -- it is
#   7x the output cost of flash and the arbitrage there is unproven.
#
# Off-peak is HALF OF THE PROVIDER'S YUAN FIGURE, which is not always exactly
# half of the IDR figure below -- the CNY->IDR conversion is not exact, so halving
# before converting and halving after differ by a fraction of a rupiah per million
# tokens. Two of the six models show it: input_offpeak 6022.76 against a half of
# 12045.50 (6022.75), and 3212.14 against a half of 6424.27 (3212.135). The other
# four land exactly. Nothing depends on the difference, and the property that IS
# required - off-peak never exceeds peak - is asserted by a test over every model.
#
# Peak is 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri, excluding Chinese public
# holidays -- about 21% of the week. billing_basis="peak" reserves at the PEAK rate so
# a request can never lose money; adjust once real traffic shows the actual
# peak/off-peak split.
#
# Customer price = rate x price, per token class.

# ===========================================================================
# KEY POOL BEHAVIOUR (global defaults; endpoints may override)
# ===========================================================================
#
# A provider key has a concurrency ceiling, not just a rate limit. The pool
# exists so one saturated key degrades throughput instead of failing requests.

# ===========================================================================
# flash -- the cheap, high-concurrency workhorse. THIS IS WHERE THE MARGIN IS.
# ===========================================================================

# FOUR FIELDS HERE ARE RECORDED, NOT ENFORCED: supports_vision, supports_thinking,
# billing_basis and concurrency_per_key. The model struct parses all four and nothing
# reads them - there is no GET /v1/models, and no document advertises a vision or
# thinking capability, so nothing customer-facing is currently false. The consequence
# is behavioural rather than a false claim: a request carrying an image is NOT rejected
# because this model is marked supports_vision = false, so the failure arrives as
# whatever the provider does with it. Recorded here so the flags read as intent rather
# than as a feature. billing_basis in particular does not affect the reserve: the
# reservation is still made at the rate the code computes, not at the peak rate this
# key names.
[[models]]
name = "flash"
description = "Fast, low-cost general model. 1M context, vision capable."
price = 1.5                    # 50% markup over wholesale (M = 1.50)

max_context_tokens = 1000000
max_output_tokens = 384000
supports_vision = true
supports_thinking = true

billing_basis = "peak"

[models.rates]
# IDR per 1M = CNY price x 2676.78.
# CNY source: off 0.01/0.5/2.0, peak 0.02/1.0/4.0
cache_read_offpeak = 26.77     # ¥0.01
cache_read_peak    = 53.54     # ¥0.02
input_offpeak      = 1338.39   # ¥0.50
input_peak         = 2676.78   # ¥1.00
output_offpeak     = 5353.56   # ¥2.00
output_peak        = 10707.12  # ¥4.00

# --- endpoints: primary, secondary, tertiary -------------------------------
#
# An endpoint is a (url + upstream_model) pair. It may hold SEVERAL API keys,
# because one key usually has its own concurrency ceiling and a single key
# becomes the bottleneck long before the provider does.
#
# KEY POOL SEMANTICS (what the router must implement per endpoint):
#
#   - api_key_envs is a POOL. Requests pick a key from it.
#   - A key that returns 429, or a concurrency-limit error, is put on
#     cooldown INDIVIDUALLY. One throttled key does NOT mark the endpoint
#     unhealthy -- only an endpoint-wide failure (5xx, timeout) does that.
#   - Capacity is CONCURRENT REQUESTS, not requests/minute. Track in-flight
#     count per key and prefer the least-loaded key.
#   - Keys are provider-scoped: a key listed under one endpoint is meaningless
#     at another endpoint's url. Do not share a pool across endpoints.
#   - Key values come from ENV VARS ONLY, named here. Never inline a key.
#
# concurrency_per_key: the ceiling the provider enforces for ONE key.
#   0 = unknown, in which case the router should learn it from 429s and back
#   off, and a warning should be logged because capacity is then a guess.
#
# weight is a GATE, not a probability: 0 = registered but never routed
# (unverified terms), anything >0 = routable. It is NOT weighted-random.
#
# Selection is DETERMINISTIC: endpoints are tried in the order written below,
# skipping any weight-0 entry and any whose circuit is open
# (server/src/upstream/client.rs, the routing loop). So the ORDER of these
# blocks is the failover precedence — put the primary first. An earlier version
# of this comment said "weighted-random"; the implementation never was.

[[models.endpoints]]
name = "primary"
url = "https://api.abc.com/v1"
upstream_model = "deepseek-flash"
api_key_envs = [
  "APK_FLASH_PRIMARY_KEY_1",
  "APK_FLASH_PRIMARY_KEY_2",
  "APK_FLASH_PRIMARY_KEY_3",
]
concurrency_per_key = 0        # unknown; learn from 429s
weight = 1.0
supports_stream_options = true

[[models.endpoints]]
name = "secondary"
url = "https://api.xyz.com/v1"
upstream_model = "deepseek-flash"
api_key_envs = [
  "APK_FLASH_SECONDARY_KEY_1",
  "APK_FLASH_SECONDARY_KEY_2",
]
concurrency_per_key = 0
weight = 1.0
supports_stream_options = true

[[models.endpoints]]
name = "tertiary"
url = "https://api.def.com/v1"
upstream_model = "deepseek-flash"
api_key_envs = [
  "APK_FLASH_TERTIARY_KEY_1",
]
concurrency_per_key = 0        # terms unverified -- weight 0, never routed
weight = 0.0
supports_stream_options = true

