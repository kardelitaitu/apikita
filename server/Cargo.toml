[package]
name = "apikita-server"
version = "0.0.1"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2.6"
time = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
thiserror = "2.0"
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
# Phase 5: the money tests need a migrated database, and SQLite makes one a temp
# file rather than a server. This is what lets them run in CI by default instead
# of behind `#[ignore = "requires live Postgres"]`.
tempfile = "3"

[lib]
name = "apikita_server"
path = "src/lib.rs"

[profile.dev]
# Dev-loop builds: keep file/line in backtraces, drop full DWARF.
# Measured from fresh target dirs: cold build 64.2s -> 28.8s, target size
# 1.9G -> 994M. Incremental edits were already frontend-bound, so the ~2s
# edit loop is unchanged; the win is cold builds, CI and disk.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not stepped through; their debug info is pure build cost.
debug = false
